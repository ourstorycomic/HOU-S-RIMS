{% extends "layouts/faculty_layout.html" %}

{% block faculty_content %}
<div id="view-f-assignment" class="fade-in">
  <div class="row g-4">
    <!-- Danh sách yêu cầu -->
    <div class="col-xl-8 col-12">
      <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
        <div class="card-header bg-white border-bottom py-3 px-4">
          <div class="d-flex flex-wrap justify-content-between align-items-center gap-2">
            <h5 class="fw-bold mb-0 text-primary"><i class="fa-solid fa-shuffle me-2"></i> LUÂN CHUYỂN GIẢNG VIÊN HƯỚNG DẪN</h5>
            <div class="d-flex flex-wrap gap-2" id="asgFilters">
              <button class="btn btn-primary btn-sm rounded-pill px-3 fw-bold" data-status="pending,faculty_pending">Cần xử lý</button>
              <button class="btn btn-light btn-sm rounded-pill px-3 fw-bold text-muted" data-status="pending">Chờ GV xác nhận</button>
              <button class="btn btn-light btn-sm rounded-pill px-3 fw-bold text-muted" data-status="faculty_pending">Chờ Khoa duyệt</button>
              <button class="btn btn-light btn-sm rounded-pill px-3 fw-bold text-muted" data-status="approved">Đã duyệt</button>
            </div>
          </div>
        </div>
        <div class="card-body p-0">
          <div class="table-responsive">
            <table class="table table-hover mb-0 align-middle">
              <thead class="bg-light text-muted small text-uppercase fw-bold">
                <tr><th class="ps-4 py-3">Mã</th><th>Đề tài & Nhóm</th><th>GV hiện tại</th><th>Trạng thái</th><th class="text-end pe-4">Thao tác</th></tr>
              </thead>
              <tbody id="asgRows"><tr><td colspan="5" class="text-center text-muted py-4">Đang tải...</td></tr></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>

    <!-- Thống kê tải GV -->
    <div class="col-xl-4 col-12">
      <div class="card border-0 shadow-sm rounded-4 p-4">
        <h6 class="fw-bold mb-3"><i class="fa-solid fa-chart-simple me-2 text-primary"></i> Tải hướng dẫn của giảng viên</h6>
        <div id="asgStats"><div class="text-muted small">Đang tải...</div></div>
      </div>
    </div>
  </div>
</div>

<!-- Modal chọn GV mới -->
<div class="modal fade" id="modalReassign" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered modal-lg modal-dialog-scrollable">
    <div class="modal-content border-0 rounded-4 shadow">
      <div class="modal-header border-bottom-0 pb-0">
        <h5 class="fw-bold mb-0 text-primary">CHUYỂN GIẢNG VIÊN HƯỚNG DẪN</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body p-4 pt-3">
        <div class="small text-muted mb-1" id="asgTopicInfo"></div>
        <div class="d-flex justify-content-between align-items-center mb-2">
          <div class="fw-bold small" id="asgSuggestTitle">Giảng viên cùng chuyên môn</div>
          <div class="form-check form-switch small">
            <input class="form-check-input" type="checkbox" id="asgShowAll">
            <label class="form-check-label" for="asgShowAll">Hiện tất cả giảng viên</label>
          </div>
        </div>
        <div id="asgSuggestList"></div>
        <div class="mt-3">
          <label class="form-label small fw-bold">Lý do chuyển (không bắt buộc)</label>
          <input type="text" id="asgReason" class="form-control" maxlength="300" placeholder="Ví dụ: GV cũ quá tải, đổi hướng nghiên cứu...">
        </div>
      </div>
      <div class="modal-footer border-0 px-4 pb-4">
        <button type="button" class="btn btn-light fw-bold px-4" data-bs-dismiss="modal">Hủy</button>
        <button type="button" class="btn btn-primary fw-bold px-4 shadow-sm" id="asgConfirm" disabled>Xác nhận chuyển</button>
      </div>
    </div>
  </div>
</div>

<script>
(function () {
  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const STATUS = {
    pending: ['CHỜ GV XÁC NHẬN', 'warning'],
    faculty_pending: ['CHỜ KHOA DUYỆT', 'info'],
    approved: ['ĐÃ DUYỆT', 'success']
  };
  let currentStatus = 'pending,faculty_pending';
  let topics = new Map();
  let selectedTopic = null, selectedMentor = null, suggestions = [];
  const modal = () => bootstrap.Modal.getOrCreateInstance($('modalReassign'));

  async function api(url, opts) {
    const res = await fetch(url, opts);
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw Object.assign(new Error(data.error || res.statusText), { code: data.code });
    return data;
  }

  function loadBar(cur, quota) {
    const pct = Math.min(100, Math.round(cur / quota * 100));
    const color = cur >= quota ? 'bg-danger' : (pct >= 60 ? 'bg-warning' : 'bg-success');
    return `<div class="progress" style="height:6px"><div class="progress-bar ${color}" style="width:${pct}%"></div></div>`;
  }

  async function loadRequests() {
    const body = $('asgRows');
    try {
      const list = await api('/api/assignment/requests?status=' + currentStatus);
      topics = new Map(list.map(t => [t.topic_id, t]));
      if (!list.length) { body.innerHTML = '<tr><td colspan="5" class="text-center text-muted py-4">Không có yêu cầu nào.</td></tr>'; return; }
      body.innerHTML = list.map(t => {
        const st = STATUS[t.status] || [t.status, 'secondary'];
        const m = t.mentor;
        return `<tr>
          <td class="ps-4 fw-bold text-primary">${esc(t.code)}</td>
          <td><div class="fw-bold text-dark">${esc(t.title)}</div>
              <small class="text-muted">${t.group ? esc(t.group.name) + (t.group.members.length ? ' · ' + esc(t.group.members.join(', ')) : '') : 'Chưa có nhóm'}</small></td>
          <td style="min-width:170px"><div class="fw-bold small">${esc(m.full_name || 'Chưa phân công')}</div>
              <div class="small text-muted">${esc(m.faculty || '')}</div>
              ${m.id ? loadBar(m.current_topics, m.quota) + `<div class="small text-muted">${m.current_topics}/${m.quota} đề tài</div>` : ''}</td>
          <td><span class="badge bg-${st[1]}-subtle text-${st[1]} border border-${st[1]}-subtle rounded-pill px-3 py-1 small">${st[0]}</span></td>
          <td class="text-end pe-4"><button class="btn btn-sm btn-outline-primary fw-bold rounded-pill" data-reassign="${t.topic_id}"><i class="fa-solid fa-shuffle me-1"></i> Chuyển GV</button></td>
        </tr>`;
      }).join('');
    } catch (e) { body.innerHTML = `<tr><td colspan="5" class="text-center text-danger py-4">${esc(e.message)}</td></tr>`; }
  }

  async function loadStats() {
    const box = $('asgStats');
    try {
      const list = await api('/api/assignment/mentor-stats');
      if (!list.length) { box.innerHTML = '<div class="text-muted small">Chưa có giảng viên.</div>'; return; }
      box.innerHTML = list.map(m => `<div class="mb-3">
          <div class="d-flex justify-content-between small"><span class="fw-bold">${esc(m.full_name)}</span><span class="text-muted">${m.current_topics}/${m.quota}</span></div>
          ${loadBar(m.current_topics, m.quota)}</div>`).join('');
    } catch (e) { box.innerHTML = `<div class="text-danger small">${esc(e.message)}</div>`; }
  }

  async function loadSuggestions() {
    const box = $('asgSuggestList');
    selectedMentor = null; $('asgConfirm').disabled = true;
    box.innerHTML = '<div class="text-muted small py-3 text-center">Đang tìm giảng viên phù hợp...</div>';
    try {
      const all = $('asgShowAll').checked ? 1 : 0;
      const data = await api(`/api/assignment/suggest?topic_id=${selectedTopic.topic_id}&all=${all}`);
      suggestions = data.suggestions;
      $('asgSuggestTitle').textContent = all ? 'Tất cả giảng viên' : 'Giảng viên cùng chuyên môn';
      if (!suggestions.length) {
        box.innerHTML = '<div class="text-muted text-center py-4">Không có giảng viên nào cùng chuyên môn. Bật "Hiện tất cả giảng viên" để chọn người khác.</div>';
        return;
      }
      box.innerHTML = suggestions.map((s, i) => `
        <label class="d-flex gap-3 align-items-start border rounded-3 p-3 mb-2" style="cursor:pointer;${s.available ? '' : 'opacity:.75'}">
          <input type="radio" name="asgMentor" class="form-check-input mt-1" value="${i}">
          <div class="flex-grow-1">
            <div class="d-flex justify-content-between flex-wrap gap-1">
              <span class="fw-bold">${esc(s.full_name)}</span>
              <span>${s.available ? '<span class="badge bg-success-subtle text-success border border-success-subtle rounded-pill">Còn chỗ</span>'
                                   : '<span class="badge bg-danger-subtle text-danger border border-danger-subtle rounded-pill">Đã đủ</span>'}</span>
            </div>
            <div class="small text-muted">${esc(s.faculty || '')}${s.same_department ? ' · <span class="text-primary fw-bold">cùng bộ môn</span>' : ''}</div>
            ${s.matched_keywords.length ? '<div class="mt-1">' + s.matched_keywords.map(k => `<span class="badge bg-primary-subtle text-primary me-1">${esc(k)}</span>`).join('') + '</div>' : ''}
            <div class="mt-2">${loadBar(s.current_topics, s.quota)}
              <div class="small text-muted">Đang giữ ${s.current_topics}/${s.quota} đề tài (${s.approved} đã duyệt, ${s.pending} đang chờ)</div></div>
          </div>
        </label>`).join('');
      box.querySelectorAll('input[name=asgMentor]').forEach(r => r.addEventListener('change', () => {
        selectedMentor = suggestions[+r.value]; $('asgConfirm').disabled = false;
      }));
    } catch (e) { box.innerHTML = `<div class="text-danger">${esc(e.message)}</div>`; }
  }

  function openReassign(topicId) {
    selectedTopic = topics.get(topicId);
    if (!selectedTopic) return;
    $('asgReason').value = '';
    $('asgShowAll').checked = false;
    $('asgTopicInfo').innerHTML = `Đề tài <b>${esc(selectedTopic.title)}</b> — GV hiện tại: <b>${esc(selectedTopic.mentor.full_name || 'Chưa phân công')}</b>`;
    modal().show();
    loadSuggestions();
  }

  async function confirmReassign() {
    if (!selectedMentor || !selectedTopic) return;
    const full = !selectedMentor.available;
    const approved = selectedTopic.status === 'approved';
    const warn = [];
    if (full) warn.push(`${selectedMentor.full_name} đã giữ ${selectedMentor.current_topics}/${selectedMentor.quota} đề tài.`);
    if (approved) warn.push('Đề tài đã được phê duyệt chính thức.');
    const c = await Swal.fire({
      title: `Chuyển cho ${selectedMentor.full_name}?`,
      html: (warn.length ? warn.map(esc).join('<br>') + '<br><br>' : '') + 'Hệ thống sẽ gửi thông báo đến Sinh viên, Giảng viên cũ và Giảng viên mới, đồng thời tự động cập nhật nhóm chat.',
      icon: warn.length ? 'warning' : 'question', showCancelButton: true,
      confirmButtonText: 'Chuyển', cancelButtonText: 'Hủy'
    });
    if (!c.isConfirmed) return;
    try {
      const r = await api('/api/assignment/reassign', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ topic_id: selectedTopic.topic_id, new_mentor_id: selectedMentor.id,
          reason: $('asgReason').value.trim(), force: full, confirm_approved: approved })
      });
      modal().hide();
      let msg = 'Đã chuyển giảng viên hướng dẫn.';
      if (r.released_slots) msg += ` Đã hủy ${r.released_slots} lịch báo cáo của nhóm với GV cũ.`;
      await Swal.fire('Thành công', msg, 'success');
      loadRequests(); loadStats();
    } catch (e) { Swal.fire('Không thể chuyển', e.message, 'error'); }
  }

  $('asgFilters').addEventListener('click', e => {
    const b = e.target.closest('button[data-status]'); if (!b) return;
    document.querySelectorAll('#asgFilters button').forEach(x => { x.classList.remove('btn-primary'); x.classList.add('btn-light', 'text-muted'); });
    b.classList.remove('btn-light', 'text-muted'); b.classList.add('btn-primary');
    currentStatus = b.dataset.status; loadRequests();
  });
  $('asgRows').addEventListener('click', e => {
    const b = e.target.closest('button[data-reassign]'); if (b) openReassign(+b.dataset.reassign);
  });
  $('asgShowAll').addEventListener('change', loadSuggestions);
  $('asgConfirm').addEventListener('click', confirmReassign);
  loadRequests(); loadStats();
})();
</script>
{% endblock %}
